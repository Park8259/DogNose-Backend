spring:
  application:
    name: dog-nose-backend

  profiles:
    default: h2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-long-random-value-for-production}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:http://localhost:8000}
